; PHP-FPM pool for Bastion: its own user, no access outside the site directory.
[bastion]
user = bastion
group = bastion
listen = /run/php/bastion.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
request_terminate_timeout = 30s

php_admin_value[open_basedir] = /srv/bastion:/tmp
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 13M
php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[session.use_strict_mode] = 1
; allow_url_fopen stays On: dzentota/http-client (S3 media, update channel) uses stream wrappers.
; Outgoing requests are restricted in the application (SSRF-checked endpoints, ADR-0011/0014), not here.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
