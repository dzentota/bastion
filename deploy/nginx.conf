# Bastion behind nginx + PHP-FPM (ADR-0025). Replace docs.example.org and the paths.
# Security headers (CSP, HSTS, frame-ancestors…) are set by the application itself;
# nginx only terminates TLS, serves /assets and passes the rest to PHP.

# --- Only when a CDN is in front: trust its addresses, and only its addresses. ---------
# Without this, REMOTE_ADDR is the CDN node and AppSensor would lock out whole CDN nodes.
# Take the ranges from your CDN (e.g. https://www.cloudflare.com/ips-v4 and -v6) and keep
# them current. Never use 0.0.0.0/0 here: anyone could then pick their own IP.
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 2400:cb00::/32;
# real_ip_header CF-Connecting-IP;   # Cloudflare; others: X-Forwarded-For with real_ip_recursive on
# -----------------------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name docs.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.example.org;

    ssl_certificate     /etc/letsencrypt/live/docs.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Only public/ is web-reachable; var/, src/, vendor/, build/ stay outside the root.
    root /srv/bastion/current/public;
    index index.php;

    server_tokens off;
    client_max_body_size 12m;   # matches the media upload limit

    # Static assets: not fingerprinted, so a short cache that revalidates. Fonts change only with a release.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "https://docs.example.org" always;
    }

    # No other files are served directly: everything else is the application.
    location / {
        try_files /index.php =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/bastion.sock;
        fastcgi_read_timeout 30s;
    }
}
